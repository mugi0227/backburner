name: Windows MVP

on:
  push:
    paths:
      - 'windows/**'
      - 'docs/WINDOWS.md'
      - '.github/workflows/windows.yml'
      - '.gitmodules'
      - 'README*.md'
      - 'tests/security/**'
  pull_request:
  workflow_dispatch:
    inputs:
      gpu:
        description: 'Also compile CUDA and Vulkan (no GPU runtime tests)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install -r windows/requirements.txt

      - name: Verify Noise tunnel compatibility
        run: |
          python -m unittest discover -s windows -p "test_*.py" -v

      - name: Check USB tool CLI compatibility
        run: |
          python -m pymobiledevice3 usbmux forward --help
          python -m pymobiledevice3 apps list --help
          python -m pymobiledevice3 apps push --help

      - name: Parse PowerShell helpers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem windows/*.ps1 | ForEach-Object {
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$parseErrors) | Out-Null
            if ($parseErrors) { throw ($parseErrors | Out-String) }
          }

      - name: Check upstream phone network policy
        if: runner.os == 'Linux'
        run: bash scripts/check-listeners.sh

  windows-cpu-build:
    needs: protocol-tests
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply Windows split-prefill patch
        run: python windows/apply_windows_port.py llama.cpp

      - name: Build native Windows CPU host
        shell: pwsh
        run: ./windows/build.ps1 -Backend cpu -BuildDir llama.cpp/build-win-ci -Parallel 2

      - name: Smoke test executables
        shell: pwsh
        run: |
          ./llama.cpp/build-win-ci/bin/Release/llama-server.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'llama-server did not start' }
          $usage = & ./llama.cpp/build-win-ci/bin/Release/llama-quantize.exe 2>&1 | Out-String
          if ($LASTEXITCODE -ne 1 -or $usage -notmatch 'usage:') { throw 'llama-quantize did not show its expected usage' }
          $global:LASTEXITCODE = 0

      - name: Package Windows host
        shell: pwsh
        run: ./windows/package.ps1 -BuildDir llama.cpp/build-win-ci -Backend cpu

      - uses: actions/upload-artifact@v4
        with:
          name: backburner-windows-cpu
          path: dist/backburner-windows-cpu.zip
          if-no-files-found: error

  windows-gpu-build:
    if: github.event_name == 'workflow_dispatch' && inputs.gpu
    needs: protocol-tests
    runs-on: windows-2022
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        backend: [cuda, vulkan]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CUDA toolkit
        if: matrix.backend == 'cuda'
        uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d # v0.2.36
        with:
          cuda: '13.2.0'
          method: network
          sub-packages: '["nvcc", "crt", "nvvm", "thrust", "cudart", "cublas", "cublas_dev", "visual_studio_integration"]'
          log-file-suffix: windows-cuda.txt
      - name: Check CUDA runtime DLL loading before compiling kernels
        if: matrix.backend == 'cuda'
        shell: pwsh
        run: ./windows/cuda_runtime.ps1 -Check
      - name: Identify CUDA binary cache
        if: matrix.backend == 'cuda'
        id: cuda_inputs
        shell: pwsh
        run: |
          "engine=$(git rev-parse HEAD:llama.cpp)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "image=$env:ImageVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Restore compiled CUDA executables
        if: matrix.backend == 'cuda'
        id: cuda_cache
        uses: actions/cache/restore@v4
        with:
          path: llama.cpp/build-win-ci/bin/Release
          key: cuda-windows-${{ steps.cuda_inputs.outputs.image }}-13.2-75-86-89-${{ steps.cuda_inputs.outputs.engine }}-${{ hashFiles('windows/build.ps1', 'windows/apply_windows_port.py', 'windows/socket-compat.h') }}
      - name: Install Vulkan SDK
        if: matrix.backend == 'vulkan'
        uses: jakoch/install-vulkan-sdk-action@3c53c378c9bfbb2ea122a1cc164a837d4004c871 # v1.5.2
        with:
          vulkan_version: '1.4.321.1'
          install_runtime: false
          stripdown: true
      - name: Build GPU host
        id: build
        if: matrix.backend != 'cuda' || steps.cuda_cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./windows/build.ps1 -Backend ${{ matrix.backend }} -BuildDir llama.cpp/build-win-ci -CudaArchitectures '75;86;89' -Parallel 2
      - name: Save compiled CUDA executables before runtime checks
        if: matrix.backend == 'cuda' && steps.cuda_cache.outputs.cache-hit != 'true' && steps.build.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: llama.cpp/build-win-ci/bin/Release
          key: ${{ steps.cuda_cache.outputs.cache-primary-key }}
      - name: Smoke test GPU executable loading
        shell: pwsh
        run: |
          ./llama.cpp/build-win-ci/bin/Release/llama-server.exe --version
          if ($LASTEXITCODE -ne 0) { throw ('GPU host executable did not start (exit 0x{0:X8})' -f [int]$LASTEXITCODE) }
      - name: Package Windows host
        shell: pwsh
        run: ./windows/package.ps1 -BuildDir llama.cpp/build-win-ci -Backend ${{ matrix.backend }}
      - uses: actions/upload-artifact@v4
        with:
          name: backburner-windows-${{ matrix.backend }}
          path: dist/backburner-windows-${{ matrix.backend }}.zip
          if-no-files-found: error
